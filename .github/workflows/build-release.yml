name: Build Windows EXE, Android APK & Deploy to GitHub

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-pages-and-standalone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & Build Web/Android PWA
        run: |
          npm install --legacy-peer-deps
          npm run build
          node scripts/package-all.mjs

      - name: Publish Standalone Chrome HTML & Project ZIP to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "بستان المعرفة — تحميل مباشر (Windows .EXE + Android .APK + Chrome .HTML)"
          body: |
            ## 🌿 تحميل تطبيق بستان المعرفة (Knowledge Garden) لجميع الأجهزة (نسخة 120 FPS المحدثة)
            - **للكمبيوتر (Windows .EXE)**: حمّل ملف `KnowledgeGarden-PC.exe` بالأسفل وافتحه مباشرة كبرنامج مستقل بدون تثبيت.
            - **لهاتف الأندرويد (Android .APK)**: حمّل ملف `KnowledgeGarden-Android.apk` وثبّته مباشرة على هاتفك بأبعاد تطبيق أصلية ودعم 120 إطار/ثانية.
            - **كصفحة Google Chrome مستقلة بدون إنترنت (.HTML)**: حمّل ملف `KnowledgeGarden-Standalone.html` وافتحه مباشرة في كروم على الكمبيوتر أو الهاتف.
          files: |
            public/KnowledgeGarden-Standalone.html
            public/KnowledgeGarden-Full-Project.zip
          prerelease: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Web Bundle & Generate Android APK via Capacitor
        run: |
          npm install --legacy-peer-deps
          npm run build
          npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../KnowledgeGarden-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnowledgeGarden-Android-APK
          path: KnowledgeGarden-Android.apk
          overwrite: true

      - name: Attach Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: KnowledgeGarden-Android.apk

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Fresh Standalone Bundle & Compile Native Windows KnowledgeGarden-PC.exe
        shell: pwsh
        run: |
          npm install --legacy-peer-deps
          npm run build
          node scripts/package-all.mjs
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /out:KnowledgeGarden-PC.exe /resource:public\KnowledgeGarden-Standalone.html,app.html electron\Launcher.cs
          if (-not (Test-Path "KnowledgeGarden-PC.exe")) { throw "Failed to compile KnowledgeGarden-PC.exe" }

      - name: Upload Windows .EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnowledgeGarden-Windows-EXE
          path: KnowledgeGarden-PC.exe
          overwrite: true

      - name: Attach Windows .EXE to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: KnowledgeGarden-PC.exe
